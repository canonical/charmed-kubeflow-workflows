name: Build, scan, and test rock

on:
  workflow_call:
    inputs:
      rock-dir:
        description: "Path to rock directory, i.e. directory containing rockcraft.yaml"
        required: true
        type: string
      rockcraft-channel:
        description: "Rockcraft channel e.g. latest/stable"
        required: false
        default: "latest/stable"
        type: string
      microk8s-channel:
        description: "Microk8s channel e.g. 1.32/stable"
        required: false
        default: "1.32/stable"
        type: string
      juju-channel:
        description: "Juju channel e.g. 3.6/stable"
        required: false
        default: "3.6/stable"
        type: string
      python-version:
        description: "Version of python to use for integration tests. If empty, it will use machine's default"
        default: ""
        required: false
        type: string
      base-ref:
        description: "Branch, tag, or commit SHA to checkout, build, test and publish. If empty, the repository's default ref is used."
        required: false
        default: ''
        type: string
      integration-ref:
        description: "Charm branch to integrate the built rock into. If empty, `base-ref` is used."
        required: false
        default: ''
        type: string
      report-failures:
        description: "If true, open (or comment on) a GitHub issue when any job of this workflow fails. Requires the caller to grant `issues: write`."
        required: false
        default: false
        type: boolean

jobs:

  resolve-image-tag:
    uses: ./.github/workflows/resolve-image-tag.yaml
    with:
      rock-dir: ${{ inputs.rock-dir }}
      base-ref: ${{ inputs.base-ref }}

  build:
    needs: [resolve-image-tag]
    uses: ./.github/workflows/build-rock.yaml
    with:
      rock-dir: ${{ inputs.rock-dir }}
      rockcraft-channel: ${{ inputs.rockcraft-channel }}
      rockcraft-extra-args: ${{ needs.resolve-image-tag.outputs.base == 'ubuntu@20.04' && '--ignore=unmaintained' || '' }}
      source-branch: ${{ inputs.base-ref }}

  scan:
    needs: [build, resolve-image-tag]
    uses: ./.github/workflows/scan-rock.yaml
    secrets: inherit
    with:
      rock-artifact: ${{ needs.build.outputs.rock-artifact }}
      rock-reference: ${{ needs.resolve-image-tag.outputs.rock-reference }}
      rock-filename: ${{ needs.build.outputs.rock-filename }}
      rockcraft-channel: ${{ inputs.rockcraft-channel }}

  sanity-tests:
    needs: [build, resolve-image-tag]
    uses: ./.github/workflows/sanity-test-rock.yaml
    with:
      tests-dir: ${{ inputs.rock-dir }}
      rock-artifact: ${{ needs.build.outputs.rock-artifact }}
      rock-reference: ${{ needs.resolve-image-tag.outputs.rock-reference }}
      rock-filename: ${{ needs.build.outputs.rock-filename }}
      rockcraft-channel: ${{ inputs.rockcraft-channel }}
      source-branch: ${{ inputs.base-ref }}

  integration-tests:
    needs: [build, resolve-image-tag]
    uses: ./.github/workflows/integration-test-rock.yaml
    with:
      tests-dir: ${{ inputs.rock-dir }}
      rock-artifact: ${{ needs.build.outputs.rock-artifact }}
      rock-reference: ${{ needs.resolve-image-tag.outputs.rock-reference }}
      rock-filename: ${{ needs.build.outputs.rock-filename }}
      python-version: ${{ inputs.python-version }}
      source-branch: ${{ inputs.base-ref }}

  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [scan, build, sanity-tests, integration-tests, resolve-image-tag]
    uses: ./.github/workflows/publish-rock.yaml
    secrets: inherit
    with:
      rock-artifact: ${{ needs.build.outputs.rock-artifact }}
      rock-filename: ${{ needs.build.outputs.rock-filename }}
      full-image-tag: ${{ needs.resolve-image-tag.outputs.full-image-tag }}
      registry: ${{ needs.resolve-image-tag.outputs.registry }}
      rockcraft-channel: ${{ inputs.rockcraft-channel }}
      source-branch: ${{ inputs.base-ref }}

  integrate-on-pr:
    if: ${{ github.event_name == 'pull_request' }}
    needs: [resolve-image-tag]
    uses: ./.github/workflows/integrate-rock.yaml
    with:
      rock-dir: ${{ inputs.rock-dir }}
      event-name: ${{ github.event_name }}
      full-image-tag: ${{ needs.resolve-image-tag.outputs.full-image-tag }}
      base-ref: ${{ inputs.base-ref }}
      integration-ref: ${{ inputs.integration-ref }}
    secrets: inherit

  integrate-on-merge:
    if: ${{ github.event_name == 'push' }}
    needs: [publish, resolve-image-tag]
    uses: ./.github/workflows/integrate-rock.yaml
    with:
      rock-dir: ${{ inputs.rock-dir }}
      event-name: ${{ github.event_name }}
      full-image-tag: ${{ needs.resolve-image-tag.outputs.full-image-tag }}
      base-ref: ${{ inputs.base-ref }}
      integration-ref: ${{ inputs.integration-ref }}
    secrets: inherit

  integrate-on-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: [publish, resolve-image-tag]
    uses: ./.github/workflows/integrate-rock.yaml
    with:
      rock-dir: ${{ inputs.rock-dir }}
      event-name: ${{ github.event_name }}
      full-image-tag: ${{ needs.resolve-image-tag.outputs.full-image-tag }}
      base-ref: ${{ inputs.base-ref }}
      integration-ref: ${{ inputs.integration-ref }}
    secrets: inherit

  # No `permissions:` block on purpose: requesting `issues: write` here would make
  # every caller fail validation unless it grants it, even when this job is skipped.
  # The token inherits the caller's permissions instead.
  report-failures:
    name: Report failure
    needs:
      - resolve-image-tag
      - build
      - scan
      - sanity-tests
      - integration-tests
      - publish
      - integrate-on-pr
      - integrate-on-merge
      - integrate-on-dispatch
    if: ${{ always() && inputs.report-failures && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Open or update failure issue for this rock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.base-ref }}
          INTEGRATION_REF: ${{ inputs.integration-ref }}
          ROCK_DIR: ${{ inputs.rock-dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Include the integration branch when it differs from the rock branch, so that
          # one rock ref integrated into several charm branches gets distinct issues.
          target="${BRANCH}"
          if [ -n "${INTEGRATION_REF}" ] && [ "${INTEGRATION_REF}" != "${BRANCH}" ]; then
            target="${BRANCH} -> ${INTEGRATION_REF}"
          fi
          # Include the current year-month in the title so that, once an issue
          # is closed, a later failure opens a fresh issue instead of being
          # silently suppressed by an already-closed one.
          month=$(date -u +'%Y-%m')
          title="Scheduled build failed: ${ROCK_DIR} on ${target} (${month})"
          body=$(printf 'Scheduled build of `%s` failed on branch `%s`.\n\nRun: %s\n' \
            "${ROCK_DIR}" "${target}" "${RUN_URL}")
          existing=$(TITLE="${title}" gh issue list --repo "${{ github.repository }}" \
            --state open \
            --search "in:title \"${title}\"" \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${{ github.repository }}" --body "${body}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "${title}" --body "${body}"
          fi
