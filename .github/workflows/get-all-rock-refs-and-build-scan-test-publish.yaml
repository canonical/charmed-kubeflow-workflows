# Reusable workflow to build, scan, test and publish rocks across all supported refs.
# It uses the `.github/automatic_backport_tracks.yaml` file (when present) to find relevant branches,
# and for each branch found (plus `main`), builds and publishes rocks.
#
# A user can also specify an optional `integration_branch_map` that maps
# a wock ref to the charm branch the rock should be integrated into. If empty,
# the charm branch with the same name is used. Example:
#
#   automatic_backport_tracks:
#     - track/X
#     - track/Y
#   integration_branch_map:
#     track/X: track/Z
#

name: Build and publish rocks for all refs

on:
  workflow_call:

jobs:
  list-refs:
    name: Compute ref matrix
    runs-on: ubuntu-24.04
    outputs:
      refs: ${{ steps.compute.outputs.refs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install yq
        run: sudo snap install yq

      - name: Build ref matrix from automatic_backport_tracks.yaml
        id: compute
        run: |
          file=.github/automatic_backport_tracks.yaml
          if [ -f "$file" ]; then
            # Emit one entry per ref, holding both the rock ref to build and the
            # charm branch to integrate into. The latter defaults to the rock
            # ref itself when `integration_branch_map` has no entry for it.
            refs=$(yq -o=json -I=0 --expression \
              '(.integration_branch_map // {}) as $m
               | (["main"] + (.automatic_backport_tracks // []))
               | map(. as $r | {"ref": $r, "integration-ref": (($m[$r]) // $r)})' \
              "$file")
          else
            echo "::warning file=${file}::${file} not found; falling back to main only"
            refs='[{"ref":"main","integration-ref":"main"}]'
          fi
          echo "Refs: ${refs}"
          echo "refs=${refs}" >> "$GITHUB_OUTPUT"

  build-scan-test-publish:
    name: Build, scan, test and publish rocks (${{ matrix.ref }})
    needs: list-refs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-refs.outputs.refs) }}
    uses: ./.github/workflows/get-all-rocks-and-build-scan-test-publish.yaml
    permissions:
      contents: read
      issues: write
    secrets: inherit
    with:
      base-ref: ${{ matrix.ref }}
      integration-ref: ${{ matrix.integration-ref }}
