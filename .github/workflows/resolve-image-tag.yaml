name: Resolve image tag

on:
  workflow_call:
    inputs:
      rock-dir:
        description: "Path to rock directory with rockcraft.yaml"
        required: true
        type: string
      base-ref:
        description: "Branch, tag, or commit SHA to resolve the tag from. If empty, the repository's default ref is used."
        required: false
        default: ''
        type: string

    outputs:
      rock-reference:
        description: "<rock-name>:<version> format"
        value: ${{ jobs.resolve.outputs.rock-reference }}
      full-image-tag:
        description: "Fully qualified image tag"
        value: ${{ jobs.resolve.outputs.full-image-tag }}
      base:
        description: "Base of the image"
        value: ${{ jobs.resolve.outputs.base }}
      registry:
        description: "Registry the image will be published to"
        value: ${{ jobs.resolve.outputs.registry }}

jobs:
  resolve:
    name: Resolve tag ${{ inputs.rock-dir }}
    runs-on: ubuntu-24.04
    outputs:
      rock-reference: ${{ steps.extract.outputs.rock-reference }}
      full-image-tag: ${{ steps.extract.outputs.full-image-tag }}
      base: ${{ steps.extract.outputs.base }}
      registry: ${{ steps.extract.outputs.registry }}
    env:
      REGISTRY: ${{ vars.ROCK_IMAGE_REGISTRY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base-ref }}
          persist-credentials: false

      - name: Install yq
        run: sudo snap install yq

      - name: Extract and construct image tag
        id: extract
        working-directory: ${{ inputs.rock-dir }}
        run: |
          NAME=$(yq '.name' rockcraft.yaml)
          VERSION=$(yq '.version' rockcraft.yaml)
          BASE=$(yq '.base' rockcraft.yaml)
          COMMIT_ID=$(git rev-parse --short HEAD)
          # Build-time timestamp (UTC), format: YYYYMMDDhhmmss.
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')

          # A rock may override the default registry by setting `registry` in its
          # rock-ci-metadata.yaml, e.g. to publish to GHCR instead of Docker Hub.
          if [[ -f rock-ci-metadata.yaml ]]; then
            REGISTRY_OVERRIDE=$(yq '.registry // ""' rock-ci-metadata.yaml)
            if [[ -n "$REGISTRY_OVERRIDE" ]]; then
              echo "Overriding registry with '${REGISTRY_OVERRIDE}' from rock-ci-metadata.yaml"
              REGISTRY="$REGISTRY_OVERRIDE"
            fi
          fi

          if [[ -z "$REGISTRY" ]]; then
            echo "No registry configured. Set the ROCK_IMAGE_REGISTRY variable or a" \
                 "'registry' entry in ${PWD}/rock-ci-metadata.yaml." >&2
            exit 1
          fi

          ROCK_REFERENCE="${NAME}:${VERSION}"
          FULL_IMAGE_TAG="${REGISTRY}/${ROCK_REFERENCE}-${COMMIT_ID}-${TIMESTAMP}"

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "rock-reference=$ROCK_REFERENCE" >> "$GITHUB_OUTPUT"
          echo "full-image-tag=$FULL_IMAGE_TAG" >> "$GITHUB_OUTPUT"
