name: Integrate rock into charm

on:
  workflow_call:
    inputs:
      rock-dir:
        required: true
        type: string
      event-name:
        required: true
        type: string
      full-image-tag:
        description: "Full image reference to the built and pushed rock image"
        required: true
        type: string
      base-ref:
        description: "Branch, tag, or commit SHA being built. Used as the default target branch when `integration-ref` is empty."
        required: false
        default: ''
        type: string
      integration-ref:
        description: "Charm branch to integrate into. Use when the rock and charm repositories do not share branch names. If empty, `base-ref` is used."
        required: false
        default: ''
        type: string
      target-branch:
        description: "Charm branch to integrate into. When set, it takes precedence over `integration-ref` and `base-ref` (except for `pull_request` events, which always target the PR base branch)."
        required: false
        default: ''
        type: string
      dry-run:
        description: "Whether to run `chaci integrate-rock` in dry-run mode or not. `pull_request` events always run in dry-run mode."
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      rock-dir:
        description: "Path to the rock directory (e.g. rocks/my-rock)"
        required: true
        type: string
      target-branch:
        description: "Branch to integrate into"
        required: true
        type: string
      dry-run:
        description: "Whether to run `chaci integrate-rock` in dry-run mode or not"
        required: false
        default: true
        type: boolean
      full-image-tag:
        description: "Full image reference from Docker registry"
        required: true
        type: string

jobs:
  integrate:
    name: Integrate ${{ inputs.full-image-tag }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_USER_EMAIL: ${{ secrets.GH_USER_EMAIL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base-ref }}
          persist-credentials: false

      - name: Install charmed-analytics-ci
        run: pipx install charmed-analytics-ci==1.3.0

      - name: Install yq
        run: sudo snap install yq

      - name: Determine target branch and dry-run
        id: params
        run: |
          # The charm branch to integrate into. `integration-ref` lets callers
          # map a rock ref onto a differently named charm branch. If empty, the
          # rock ref is used.
          integration_ref="${{ inputs.integration-ref }}"
          target_branch="${integration_ref:-${{ inputs.base-ref }}}"

          # `dry-run` can be set both on direct workflow_dispatch and through
          # workflow_call (e.g. a caller exposing its own workflow_dispatch).
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            dry_run="--dry-run"
          else
            dry_run=""
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "target_branch=${{ github.base_ref }}" >> $GITHUB_OUTPUT
            echo "dry_run=--dry-run" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.target-branch }}" ]]; then
            # Explicit target branch, either from a direct workflow_dispatch
            # trigger on this workflow or passed in through workflow_call.
            echo "target_branch=${{ inputs.target-branch }}" >> $GITHUB_OUTPUT
            echo "dry_run=${dry_run}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            # Called from a workflow_dispatch / schedule triggered chain: the
            # ref being built is integrated into `target_branch`.
            echo "Integrating rock ref '${{ inputs.base-ref }}' into charm branch '${target_branch}'"
            echo "target_branch=${target_branch}" >> $GITHUB_OUTPUT
            echo "dry_run=${dry_run}" >> $GITHUB_OUTPUT
          else
            echo "target_branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
            echo "dry_run=${dry_run}" >> $GITHUB_OUTPUT
          fi

      - name: Determine triggering PR (if merged)
        id: triggering_pr
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Workflow dispatch — skipping triggering PR detection."
            echo "url=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR event — skipping triggering PR detection."
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            sudo apt update && sudo apt install -y gh

            pr_number=$(gh pr list --state merged --search "$(git rev-parse --short HEAD)" --json number --jq '.[0].number' || true)

            if [[ -n "$pr_number" ]]; then
              pr_url="https://github.com/${{ github.repository }}/pull/$pr_number"
              echo "Found triggering PR: $pr_url"
              echo "url=$pr_url" >> "$GITHUB_OUTPUT"
            else
              echo "No triggering PR found."
              echo "url=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Import and configure the GPG key for chaci
        uses: crazy-max/ghaction-import-gpg@92a10f995fd20944e1cae9a2e86e62dafe4f6171
        with:
          gpg_private_key: ${{ secrets.CHACI_GPG_PRIVATE }}
          passphrase: ${{ secrets.CHACI_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_email: ${{ secrets.GH_USER_EMAIL }}

      - name: Run chaci integrate-rock
        run: |
          chaci integrate-rock \
            "${{ inputs.rock-dir }}/rock-ci-metadata.yaml" \
            "${{ steps.params.outputs.target_branch }}" \
            "${{ inputs.full-image-tag }}" \
            ${{ steps.params.outputs.dry_run }} \
            $([[ -n "${{ steps.triggering_pr.outputs.url }}" ]] && echo "--triggering-pr ${{ steps.triggering_pr.outputs.url }}")
