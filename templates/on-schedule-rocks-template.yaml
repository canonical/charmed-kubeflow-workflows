# Meant to be copied over as is in all rocks repositories with
# the name `on_schedule.yaml`. Assumes the consumer repo has a
# `.github/automatic_backport_tracks.yaml` file.
#
# A user can also specify an optional `integration_branch_map` that maps
# a rock ref to the charm branch the rock should be integrated into. If empty,
# the charm branch with the same name is used. Example:
#
#   automatic_backport_tracks:
#     - track/X
#     - track/Y
#   integration_branch_map:
#     track/X: track/Z
#
# Runs once a month and on manual dispatch. Rocks are built for `main` plus
# every ref listed under `automatic_backport_tracks`. For each ref, every rock
# in the repository (i.e. every directory containing a rockcraft.yaml) is
# built, scanned, tested and published. On failure, a GitHub issue is opened
# (or commented on) per failing rock.
name: Scheduled rebuild rocks

on:
  schedule:
    - cron: '0 4 1 * *'   # 1st of each month, 04:00 UTC
  workflow_dispatch:

jobs:
  build-scan-test-publish:
    name: Build, scan, test and publish rocks
    uses: canonical/charmed-kubeflow-workflows/.github/workflows/get-all-rock-refs-and-build-scan-test-publish.yaml@main
    permissions:
      contents: read
      issues: write
    secrets: inherit
